[package]
name = "vessel_compiler"
version = "0.1.0"
edition = "2021"
description = "Vessel: A Programming Language Derived from Scale Calculus"
authors = ["Solt (Ayokunle Olufosoye) <ayolufosoye@gmail.com>"]

[[bin]]
name = "vesselc"
path = "src/main.rs"

[dependencies]
# Core compiler: stdlib only.
# Native codegen: inkwell wraps LLVM 19 safely.
inkwell = { version = "0.9.0", features = ["llvm19-1"] }
